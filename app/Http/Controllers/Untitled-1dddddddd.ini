<?php

namespace App\Http\Controllers;

use Spatie\Image\Enums\AlignPosition;
use Spatie\Image\Enums\BorderType;
use Spatie\Image\Enums\Unit;
use Spatie\Image\Image;

class TestController extends Controller
{
    public function index()
    {
        $frame = Image::load('frame.jpg');

        $insert = Image::load('in.jpeg')->border(4, BorderType::Expand, '007698');
        $insert2 = Image::load('logo.png');
        $img = $frame
            ->watermark($insert, AlignPosition::CenterCenter, paddingY: -120, width: 100,
                widthUnit: Unit::Percent,
                height: 50,
                heightUnit: Unit::Percent)
            ->watermark($insert2, AlignPosition::RightTop, paddingX: 40, paddingY: 20, width: 30,
                widthUnit: Unit::Percent,
                height: 15,
                heightUnit: Unit::Percent)
            ->text('বরিশালের চরবাড়ীয়ায় খাল দখল', fontSize: 100, color: 'ffff',
                y: 950, fontPath: public_path('SolaimanLipi_Bold_10-03-12.ttf'), x: 25, width: 3000)
            ->text('করে দোকান নির্মাণ', fontSize: 100, color: 'FFBF00',
                y: 1050, fontPath: public_path('SolaimanLipi_Bold_10-03-12.ttf'), x: 239, width: 3000)
            ->text('বিস্তারিত কমেন্টে...', fontSize: 50, color: '29b',
                y: 1250, fontPath: public_path('SolaimanLipi_Bold_10-03-12.ttf'), x: 425, width: 3000)
            ->save('example.jpg');

        return view('test');
    }
}
